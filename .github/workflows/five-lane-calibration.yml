name: Five-Lane Cost Calibration [CONTAINED — TVC PROVIDER CAPABILITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: five-lane-calibration-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block direct provider credential path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Five-lane calibration is contained because the prior workflow directly consumed provider API secrets and pushed calibration outputs under GitHub Actions authority."
          echo "Use canonical TVC provider-capability evidence with no credential export; publication requires separately admitted mutation authority."
          exit 1
