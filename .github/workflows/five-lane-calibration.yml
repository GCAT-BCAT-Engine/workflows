name: Five-Lane Cost Calibration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/five-lane-calibration/**'
      - '.github/workflows/five-lane-calibration.yml'

permissions:
  contents: write

concurrency:
  group: five-lane-cost-calibration
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_CALIBRATION_MODEL: ${{ vars.OPENAI_CALIBRATION_MODEL || 'gpt-5.6' }}
      ANTHROPIC_CALIBRATION_MODEL: ${{ vars.ANTHROPIC_CALIBRATION_MODEL || 'claude-sonnet-4-6' }}
    steps:
      - uses: actions/checkout@v4
      - name: Credential boundary
        run: |
          test -n "$OPENAI_API_KEY"
          test -n "$ANTHROPIC_API_KEY"
      - name: Run exact-task calibration and TA-006 estimate
        run: python experiments/five-lane-calibration/run.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: five-lane-calibration-evidence
          path: experiments/five-lane-calibration/results/
      - name: Commit validated outputs safely
        shell: bash
        run: |
          git config user.name 'stegverse-calibration-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add experiments/five-lane-calibration/results
          git diff --cached --quiet && exit 0
          git commit -m 'Record five-lane cost calibration and TA-006 estimate'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
