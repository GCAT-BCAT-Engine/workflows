name: Four-Lane Equivalent-Output Benchmark [CONTAINED — TVC PROVIDER CAPABILITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: four-lane-equivalent-output-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block direct provider credential path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Four-lane equivalent-output benchmark is contained because the prior workflow directly consumed provider API secrets and committed benchmark results under GitHub Actions authority."
          echo "Provider execution must use canonical TVC capability evidence without credential export; durable result publication requires separate admitted mutation authority."
          exit 1
