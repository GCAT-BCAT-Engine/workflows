name: Governed Cost Evaluation [CONTAINED — TVC PROVIDER CAPABILITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: governed-cost-evaluation-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block direct provider credential path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Governed cost evaluation is contained because the prior workflow directly consumed provider API secrets and committed evaluation outputs under GitHub Actions authority."
          echo "Canonical TVC provider capability must own credential-bearing provider access; the consumer may receive only secret-free results/receipts."
          exit 1
