name: StegVerse LLM Adapter Gate [CONTAINED — CANONICAL TVC REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: llm-adapter-gate-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block local authority substitution
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::This legacy adapter gate is contained because it directly consumed provider secrets and locally synthesized a 'TVC' ALLOW/FAIL_CLOSED decision without canonical TVC authority evidence."
          echo "Provider capability authority is StegVerse-Labs/TVC. A replacement must consume a verifiable TVC capability/receipt, export no provider credential to this consumer, and treat route/provider availability as non-authorizing evidence."
          exit 1
