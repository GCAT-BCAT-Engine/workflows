name: StegVerse LLM Provider Check [RETIRED — TVC PROVIDER CAPABILITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: llm-provider-check-retired
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block consumer-side provider secret inspection
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Direct provider-secret presence probing in this consumer repository is retired. Provider credential readiness belongs to canonical TVC authority and must be represented only by secret-free capability/readiness evidence."
          exit 1
