name: Provider Secret Boundary Validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tools/verify_no_direct_provider_secrets.py"
      - "tests/test_provider_secret_boundary.py"
      - "tests/test_provider_secret_retirement_audit.py"
      - "tests/test_provider_secret_historical_source_audit.py"
      - "security/provider-secret-workflow-retirement-audit.v1.json"
      - "security/provider-secret-historical-source-audit.v1.json"
      - "tools/validate_provider_secret_retirement_audit.py"
      - "tools/validate_provider_secret_historical_source_audit.py"
      - "docs/WORKFLOWS_SECURITY_MIRROR_HANDOFF.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "tools/verify_no_direct_provider_secrets.py"
      - "tests/test_provider_secret_boundary.py"
      - "docs/WORKFLOWS_SECURITY_MIRROR_HANDOFF.md"

permissions: {}

concurrency:
  group: provider-secret-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify provider secret boundary
        run: |
          python tools/verify_no_direct_provider_secrets.py --root .
          python -m unittest -q tests.test_provider_secret_boundary
          python tools/validate_provider_secret_retirement_audit.py
          python -m unittest -q tests.test_provider_secret_retirement_audit
          python tools/validate_provider_secret_historical_source_audit.py
          python -m unittest -q tests.test_provider_secret_historical_source_audit
