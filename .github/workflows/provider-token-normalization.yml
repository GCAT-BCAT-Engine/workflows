name: Normalized StegVerse Provider Tokens [CONTAINED — TVC PROVIDER CAPABILITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: provider-token-normalization-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block direct provider secret consumption
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Provider-token normalization is contained because the prior consumer workflow directly interpolated provider API secrets and committed results under GitHub Actions authority."
          echo "Use the canonical TVC provider-capability contract; provider credentials must not enter this consumer workflow. Durable publication requires separately admitted mutation authority."
          exit 1
