name: Staged Mathematical Progress Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/staged-math-progress/**'
      - '.github/workflows/staged-math-progress.yml'

permissions:
  contents: write

concurrency:
  group: staged-math-progress
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_MODEL: gpt-5.6
      ANTHROPIC_MODEL: claude-sonnet-4-6
      MAX_STAGE_OUTPUT: '900'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install canonical tokenizer
        run: pip install tiktoken==0.12.0

      - name: Run four-lane staged benchmark
        run: python experiments/staged-math-progress/run.py

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: staged-math-progress-results
          path: experiments/staged-math-progress/results/

      - name: Commit results safely
        shell: bash
        run: |
          git config user.name 'staged-math-progress-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add experiments/staged-math-progress/results
          git diff --cached --quiet && exit 0
          git commit -m 'Record staged mathematical progress benchmark'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
