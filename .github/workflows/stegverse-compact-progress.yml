name: StegVerse Compact-Context Capability Benchmark [CONTAINED — TVC PROVIDER CAPABILITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: stegverse-compact-progress-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block direct provider credential path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Compact-context capability benchmark is contained because the prior workflow directly consumed provider API secrets and pushed benchmark results under GitHub Actions authority."
          echo "Provider execution must be performed through canonical TVC capability evidence without credential export; result publication requires separate admitted mutation authority."
          exit 1
