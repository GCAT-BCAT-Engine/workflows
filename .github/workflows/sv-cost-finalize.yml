name: SV-COST Finalize Relational Program

on:
  workflow_run:
    workflows: ["SV-COST R3 Controller v2"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sv-cost-finalize-relational-program
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Verify terminal prior state
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          test -s experiments/sv-cost-program/results/historical-lineage-observation.json
          test -s experiments/sv-cost-program/results/r2-adjudication.json
          test -s experiments/sv-cost-program/results/r3-adjudication.json
          test -s experiments/sv-cost-normalized/results/result.json
          python - <<'PY'
          import json
          from pathlib import Path
          r2 = json.loads(Path('experiments/sv-cost-program/results/r2-adjudication.json').read_text())
          r3 = json.loads(Path('experiments/sv-cost-program/results/r3-adjudication.json').read_text())
          assert r2['status'] == 'R2_ADJUDICATED'
          assert r3['status'] == 'R3_ADJUDICATED'
          assert r3['evidence']['paired_n'] == 5
          PY

      - name: Adjudicate R4 and synthesize R5 and CFO decision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('experiments/sv-cost-program')
          results_dir = root / 'results'
          results_dir.mkdir(parents=True, exist_ok=True)

          normalized_path = Path('experiments/sv-cost-normalized/results/result.json')
          r2_path = results_dir / 'r2-adjudication.json'
          r3_path = results_dir / 'r3-adjudication.json'
          relations_path = root / 'relations.json'
          evidence_index_path = root / 'evidence-index.json'
          lineage_path = root / 'lineage.json'
          analysis_path = Path('docs/SV_COST_MAJOR_ANALYSIS.md')

          normalized = json.loads(normalized_path.read_text())
          r2 = json.loads(r2_path.read_text())
          r3 = json.loads(r3_path.read_text())
          relations = json.loads(relations_path.read_text())
          evidence_index = json.loads(evidence_index_path.read_text())
          lineage = json.loads(lineage_path.read_text())

          lanes = {lane['lane_id']: lane for lane in normalized['lanes']}
          assert {'openai', 'anthropic', 'stegverse-only'} <= set(lanes)
          assert normalized['all_three_comparable'] is True

          sha = lambda p: 'sha256:' + hashlib.sha256(p.read_bytes()).hexdigest()

          r4 = {
              'program_id': 'SV-COST-MAJOR-GOAL-001',
              'relation_id': 'R4-GENERATION-VS-RECONSTRUCTION',
              'status': 'R4_ADJUDICATED_DIFFERENT_OPERATION',
              'verdict': 'EXTERNAL_PROVIDER_GENERATION_CAN_BE_AVOIDED_FOR_ALREADY_ADMITTED_WORK_NET_SAVINGS_UNPROVEN',
              'operation_boundary': {
                  'provider_lanes': 'fresh generation',
                  'stegverse_lane': 'deterministic reconstruction from admitted repository state',
                  'like_for_like_inference_comparison': False,
              },
              'evidence': {
                  'normalized_result_sha256': sha(normalized_path),
                  'task_contract_hash': normalized['task_contract_hash'],
                  'all_selected_obligations_satisfied': normalized['all_three_comparable'],
              },
              'external_provider_avoidance_scenarios_usd_per_reconstruction': {
                  'instead_of_openai_generation': lanes['openai']['observed_provider_cost_usd'],
                  'instead_of_anthropic_generation': lanes['anthropic']['observed_provider_cost_usd'],
              },
              'stegverse': {
                  'external_input_tokens': lanes['stegverse-only']['input_tokens'],
                  'external_output_tokens': lanes['stegverse-only']['output_tokens'],
                  'external_provider_cost_usd': lanes['stegverse-only']['observed_provider_cost_usd'],
                  'local_cost_status': lanes['stegverse-only']['local_cost_status'],
              },
              'publication_gate': {
                  'external_provider_charge_avoidance_admissible': True,
                  'net_savings_admissible': False,
                  'fully_burdened_roi_admissible': False,
                  'claim_boundary': 'This is governed reuse economics for already admitted work. Local compute, storage, verification, engineering, and maintenance costs remain unmeasured.',
              },
          }
          (results_dir / 'r4-adjudication.json').write_text(json.dumps(r4, indent=2) + '\n')

          r5 = {
              'program_id': 'SV-COST-MAJOR-GOAL-001',
              'relation_id': 'R5-REPEATED-TRIALS',
              'status': 'R5_ADJUDICATED_CROSS_RELATION_RELIABILITY',
              'relations': {
                  'R2': {
                      'paired_n': r2['evidence']['paired_n'],
                      'verdict': r2['verdict'],
                      'direct_completion_rate': r2['direct']['completion_rate'],
                      'batch_completion_rate': r2['batch']['completion_rate'],
                      'direct_verifier_pass_rate': r2['direct']['verifier_pass_rate'],
                      'batch_verifier_pass_rate': r2['batch']['verifier_pass_rate'],
                      'cost_delta_ci95': r2['paired_effect']['cost_delta_ci95'],
                      'latency_delta_ci95': r2['paired_effect']['latency_delta_ci95'],
                  },
                  'R3': {
                      'paired_n': r3['evidence']['paired_n'],
                      'verdict': r3['verdict'],
                      'full_successful_output_rate': r3['full']['successful_output_rate'],
                      'managed_successful_output_rate': r3['managed']['successful_output_rate'],
                      'input_token_delta_ci95': r3['paired_effect']['input_token_delta_ci95'],
                      'cost_delta_ci95': r3['paired_effect']['cost_delta_ci95'],
                      'latency_delta_ci95': r3['paired_effect']['latency_delta_ci95'],
                  },
              },
              'total_paired_trials_across_distinct_relations': r2['evidence']['paired_n'] + r3['evidence']['paired_n'],
              'pooled_effect_admissible': False,
              'claim_boundary': 'R2 and R3 estimate different causal relations and may not be pooled into one savings percentage. Failure rates, confidence intervals, and bounded repairs remain part of the result.',
          }
          (results_dir / 'r5-reliability-synthesis.json').write_text(json.dumps(r5, indent=2) + '\n')

          context_admissible = bool(r3['publication_gate']['headline_context_savings_admissible'])
          cfo = {
              'program_id': 'SV-COST-MAJOR-GOAL-001',
              'status': 'DECISION_READY_WITH_BOUNDED_CLAIMS',
              'decision': 'DO_NOT_APPROVE_A_GENERAL_STEGVERSE_SAVINGS_CLAIM_FROM_CURRENT_EVIDENCE',
              'findings': {
                  'historical_control_envelope_reproduced': True,
                  'successful_route_savings_established': False,
                  'successful_managed_context_savings_established': context_admissible,
                  'external_provider_charge_avoidance_for_admitted_reconstruction_established': True,
                  'net_reconstruction_savings_established': False,
              },
              'required_before_roi_approval': [
                  'measure StegVerse compute, storage, verification, engineering, and maintenance cost',
                  'reconcile pricing-derived provider costs to invoices',
                  'repeat any favorable R3 effect on an independent held-out workload',
                  'calculate workload-weighted break-even and sensitivity ranges',
              ],
              'claim_boundary': 'The evidence program is decision-ready because it supports a bounded decision, not because it proves a favorable ROI.',
              'canonical_analysis': 'docs/SV_COST_MAJOR_ANALYSIS.md',
          }
          (results_dir / 'cfo-decision.json').write_text(json.dumps(cfo, indent=2) + '\n')

          relations['status'] = 'RELATIONAL_PROGRAM_EXECUTED_DECISION_READY_BOUNDED_CLAIMS'
          for relation in relations['relations']:
              if relation['id'] == 'R4-GENERATION-VS-RECONSTRUCTION':
                  relation['status'] = r4['verdict']
                  relation['adjudication_ref'] = str(results_dir / 'r4-adjudication.json')
              elif relation['id'] == 'R5-REPEATED-TRIALS':
                  relation['status'] = r5['status']
                  relation['adjudication_ref'] = str(results_dir / 'r5-reliability-synthesis.json')
          relations_path.write_text(json.dumps(relations, indent=2) + '\n')

          evidence_index['status'] = 'RELATIONAL_PROGRAM_EXECUTED_DECISION_READY_BOUNDED_CLAIMS'
          evidence_index['active_relation'] = None
          evidence_index['terminal_relations'] = [
              'R1-HISTORICAL-REPEAT',
              'R2-DIRECT-VS-BATCH',
              'R3-FULL-VS-STEGVERSE-CONTEXT',
              'R4-GENERATION-VS-RECONSTRUCTION',
              'R5-REPEATED-TRIALS',
          ]
          evidence_index['decision_receipt'] = str(results_dir / 'cfo-decision.json')
          evidence_index_path.write_text(json.dumps(evidence_index, indent=2) + '\n')

          lineage['status'] = 'RELATIONAL_PROGRAM_EXECUTED_DECISION_READY_BOUNDED_CLAIMS'
          lineage['terminal_receipts'] = [
              str(results_dir / 'r2-adjudication.json'),
              str(results_dir / 'r3-adjudication.json'),
              str(results_dir / 'r4-adjudication.json'),
              str(results_dir / 'r5-reliability-synthesis.json'),
              str(results_dir / 'cfo-decision.json'),
          ]
          lineage_path.write_text(json.dumps(lineage, indent=2) + '\n')

          text = analysis_path.read_text()
          marker = '\n## Final program synthesis\n'
          final_section = marker + f'''\n**Program state:** `RELATIONAL_PROGRAM_EXECUTED_DECISION_READY_BOUNDED_CLAIMS`\n\n**CFO decision:** Do not approve a general StegVerse savings or ROI claim from the current evidence.\n\n- R1 reproduced the historical control envelope with an explicit reconstruction boundary.\n- R2 observed a native batch route and pricing effect, but successful quality-equivalent outputs were not established.\n- R3 verdict: `{r3['verdict']}`.\n- R3 headline managed-context savings admissible: `{str(context_admissible).lower()}`.\n- R4 establishes only that reconstruction of already admitted work can avoid a new external provider-generation charge; net savings remain unproven because local costs are unmeasured.\n- R5 retains {r5['total_paired_trials_across_distinct_relations']} paired trials across two distinct causal relations and does not pool them into one savings percentage.\n\n### Required before ROI approval\n\n1. Meter StegVerse compute, storage, verification, engineering, and maintenance cost.\n2. Reconcile pricing-derived provider charges to invoices.\n3. Repeat any favorable R3 effect on a held-out workload.\n4. Produce workload-weighted break-even and sensitivity ranges.\n\nThe completed testing program supports a bounded financial decision. It does not support a favorable general savings claim unless the remaining cost and validation gates are satisfied.\n\nMachine-readable decision receipt: `experiments/sv-cost-program/results/cfo-decision.json`\n'''
          if marker in text:
              text = text.split(marker)[0].rstrip() + final_section
          else:
              text = text.rstrip() + final_section
          text = text.replace('Status: **IN PROGRESS — R3 ACTIVE — NO CFO SAVINGS CLAIM YET**', 'Status: **DECISION READY — BOUNDED CLAIMS — GENERAL SAVINGS CLAIM NOT APPROVED**')
          analysis_path.write_text(text)
          PY

      - name: Validate canonical terminal surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool experiments/sv-cost-program/evidence-index.json >/dev/null
          python -m json.tool experiments/sv-cost-program/lineage.json >/dev/null
          python -m json.tool experiments/sv-cost-program/relations.json >/dev/null
          python -m json.tool experiments/sv-cost-program/results/r4-adjudication.json >/dev/null
          python -m json.tool experiments/sv-cost-program/results/r5-reliability-synthesis.json >/dev/null
          python -m json.tool experiments/sv-cost-program/results/cfo-decision.json >/dev/null
          grep -q 'DECISION READY' docs/SV_COST_MAJOR_ANALYSIS.md
          grep -q 'Final program synthesis' docs/SV_COST_MAJOR_ANALYSIS.md

      - name: Commit terminal synthesis
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sv-cost-finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git add experiments/sv-cost-program/evidence-index.json
          git add experiments/sv-cost-program/lineage.json
          git add experiments/sv-cost-program/relations.json
          git add experiments/sv-cost-program/results/r4-adjudication.json
          git add experiments/sv-cost-program/results/r5-reliability-synthesis.json
          git add experiments/sv-cost-program/results/cfo-decision.json
          git add docs/SV_COST_MAJOR_ANALYSIS.md
          if ! git diff --cached --quiet; then
            git commit -m "Finalize SV-COST relational evidence and CFO decision"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then break; fi
              git rebase --abort || true
              sleep $((attempt * 3))
            done
          fi
          decision="$(jq -r .decision experiments/sv-cost-program/results/cfo-decision.json)"
          gh issue comment 12 --repo "$GITHUB_REPOSITORY" --body "The relational testing program reached a terminal decision-ready state. CFO decision: \`$decision\`. Canonical synthesis: \`docs/SV_COST_MAJOR_ANALYSIS.md\`. Machine-readable receipt: \`experiments/sv-cost-program/results/cfo-decision.json\`."
