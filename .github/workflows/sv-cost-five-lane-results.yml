name: SV Cost Five-Lane Results [CONTAINED — TVC / ADMISSION EVIDENCE REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sv-cost-five-lane-results-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block credential and admissibility substitution
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Five-lane result workflow is contained because it directly consumed provider API secrets, committed outputs under GitHub Actions authority, and treated locally produced admissibility/publication fields as a release gate."
          echo "Provider execution requires canonical TVC capability evidence. Any admissibility/publication claim requires independently bound governance evidence; durable publication requires separate mutation authority."
          exit 1
