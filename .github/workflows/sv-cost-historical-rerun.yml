name: Historical sv-cost VAL-001 BL-001 Rerun [CONTAINED — TVC PROVIDER CAPABILITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sv-cost-historical-rerun-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block direct provider credential rerun
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Historical rerun is contained because the prior workflow directly consumed a provider API secret and committed reconstructed results under GitHub Actions authority."
          echo "Historical evidence remains preserved. New reconstruction requires canonical TVC provider capability and separately admitted result-publication authority."
          exit 1
