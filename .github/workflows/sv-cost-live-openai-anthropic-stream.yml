name: SV-COST Live Provider Capability Stream [CONTAINED — TVC PROVIDER CAPABILITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sv-cost-live-provider-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block consumer-side provider credentials and publication
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Live provider stream is contained because the prior workflow labeled GitHub Actions provider secrets as TV/TVC delivery and then committed live results under GitHub-hosted authority."
          echo "Canonical TVC must resolve/provider-bind capability without exporting provider credentials to this consumer; any persisted result requires separately admitted mutation authority."
          exit 1
