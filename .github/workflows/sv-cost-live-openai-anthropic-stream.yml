name: SV-COST Live Provider Capability Stream

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: Events per lane (5-200)
        required: false
        default: '5'
  push:
    branches: [main]
    paths:
      - experiments/sv-cost-program/stream-governance/live-provider-test-trigger.json
      - experiments/sv-cost-program/cost-model/provider-capability-policy.json
      - experiments/sv-cost-program/stream-governance/resolve_provider_routes.py
      - experiments/sv-cost-program/stream-governance/run_live_provider_pair.py

permissions:
  contents: write

concurrency:
  group: sv-cost-live-provider-capability-stream
  cancel-in-progress: false

jobs:
  live-provider-pair:
    runs-on: ubuntu-latest
    environment: sv-cost-live-provider-test
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LIVE_STREAM_SAMPLE_SIZE: ${{ github.event.inputs.sample_size || '5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed if TV/TVC credential delivery is missing
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY not delivered by TV/TVC' >&2; exit 2; }
          test -n "$ANTHROPIC_API_KEY" || { echo 'ANTHROPIC_API_KEY not delivered by TV/TVC' >&2; exit 2; }
          if ! [[ "$LIVE_STREAM_SAMPLE_SIZE" =~ ^[0-9]+$ ]] || [ "$LIVE_STREAM_SAMPLE_SIZE" -lt 5 ] || [ "$LIVE_STREAM_SAMPLE_SIZE" -gt 200 ]; then
            echo 'sample_size must be an integer from 5 through 200' >&2
            exit 2
          fi

      - name: Resolve authorized provider routes from capability policy
        run: python experiments/sv-cost-program/stream-governance/resolve_provider_routes.py

      - name: Validate no-secret route receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt=experiments/sv-cost-program/stream-governance/live-provider-results/resolved_provider_routes.json
          test -s "$receipt"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('experiments/sv-cost-program/stream-governance/live-provider-results/resolved_provider_routes.json')
          d=json.loads(p.read_text())
          assert d['receipt_type']=='TV_TVC_NO_SECRET_MODEL_ROUTE_RESOLUTION'
          assert d['credentials_recorded'] is False
          assert {r['provider'] for r in d['routes']} == {'openai','anthropic'}
          assert all(r['selected_model_id'] for r in d['routes'])
          assert d['resolution_hash'].startswith('sha256:')
          forbidden=['api_key','authorization','bearer ','sk-']
          text=p.read_text().lower()
          assert not any(x in text for x in forbidden), 'credential-like content found in route receipt'
          print(json.dumps({'valid': True, 'routes': {r['provider']: r['selected_model_id'] for r in d['routes']}}))
          PY

      - name: Run identical stream sample through four lanes
        run: python experiments/sv-cost-program/stream-governance/run_live_provider_pair.py

      - name: Validate live evidence surfaces
        shell: bash
        run: |
          set -euo pipefail
          base=experiments/sv-cost-program/stream-governance/live-provider-results
          test -s "$base/live_provider_pair_results.jsonl"
          test -s "$base/live_provider_pair_summary.json"
          python -m json.tool "$base/live_provider_pair_summary.json" >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          b=Path('experiments/sv-cost-program/stream-governance/live-provider-results')
          rows=[json.loads(x) for x in (b/'live_provider_pair_results.jsonl').read_text().splitlines() if x.strip()]
          summary=json.loads((b/'live_provider_pair_summary.json').read_text())
          routes=json.loads((b/'resolved_provider_routes.json').read_text())
          expected={'openai-raw','openai-governed','anthropic-raw','anthropic-governed'}
          lanes={r['lane_id'] for r in rows}
          assert lanes == expected, (lanes, expected)
          assert {x['lane_id'] for x in summary['lanes']} == expected
          assert all('usage' in r for r in rows)
          assert all(r['response_hash'].startswith('sha256:') for r in rows)
          assert all(r['model_resolution_hash']==routes['resolution_hash'] for r in rows)
          print(json.dumps({'valid': True, 'rows': len(rows), 'lanes': sorted(lanes), 'resolution_hash': routes['resolution_hash']}))
          PY

      - name: Commit live receipts
        run: |
          set -euo pipefail
          git config user.name 'stegverse-governance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add experiments/sv-cost-program/stream-governance/live-provider-results/
          if git diff --cached --quiet; then
            echo 'No live provider output changes.'
            exit 0
          fi
          git commit -m "Record capability-resolved provider stream comparison [run $GITHUB_RUN_ID]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Summary
        if: always()
        run: |
          echo '## Live capability-resolved provider stream comparison' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'TV/TVC supplies credentials. Capability policy resolves provider model routes at runtime.' >> "$GITHUB_STEP_SUMMARY"
          if [ -f experiments/sv-cost-program/stream-governance/live-provider-results/resolved_provider_routes.json ]; then
            echo '### Route resolution receipt' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat experiments/sv-cost-program/stream-governance/live-provider-results/resolved_provider_routes.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f experiments/sv-cost-program/stream-governance/live-provider-results/live_provider_pair_summary.json ]; then
            echo '### Live comparison' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat experiments/sv-cost-program/stream-governance/live-provider-results/live_provider_pair_summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No live summary produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
