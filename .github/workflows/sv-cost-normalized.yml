name: SV Cost Normalized Three-Platform Harness [CONTAINED — TVC PROVIDER CAPABILITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sv-cost-normalized-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block direct provider secret consumption and result mutation
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Normalized provider harness is contained because the prior workflow directly consumed provider API secrets and pushed result state to main."
          echo "Reintroduce provider execution only through canonical TVC capability evidence with no credential export; durable result publication requires separate mutation authority."
          exit 1
