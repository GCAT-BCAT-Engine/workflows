name: SV-COST R2 Direct vs Batch [CONTAINED — TVC PROVIDER CAPABILITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sv-cost-r2-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block direct provider credential and evidence mutation path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::R2 direct-vs-batch execution is contained because the prior workflow directly consumed a provider API secret and committed governed evidence under GitHub Actions authority."
          echo "Historical results remain evidence. Any rerun requires canonical TVC provider capability with no credential export and separately admitted result-publication authority."
          exit 1
