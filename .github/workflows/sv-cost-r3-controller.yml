name: SV-COST R3 Controller

on:
  workflow_run:
    workflows: ["SV-COST R3 Full vs Managed Context"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: sv-cost-r3-controller
  cancel-in-progress: false

jobs:
  observe-adjudicate-continue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve R3 run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_run ]]; then
            run_id="$EVENT_RUN_ID"
            conclusion="$EVENT_CONCLUSION"
            attempt="$EVENT_ATTEMPT"
          else
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sv-cost-r3-full-vs-managed.yml/runs?branch=main&per_page=1")"
            run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$run_json")"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$run_json")"
            attempt="$(jq -r '.workflow_runs[0].run_attempt // 1' <<<"$run_json")"
          fi
          test -n "$run_id" || { echo 'No R3 workflow run found' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_OUTPUT"

      - name: Continue failed R3 run
        if: steps.run.outputs.conclusion != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          ATTEMPT: ${{ steps.run.outputs.attempt }}
          RUN_URL: ${{ steps.run.outputs.run_url }}
        shell: bash
        run: |
          set -euo pipefail
          if (( ATTEMPT < 3 )); then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun-failed-jobs"
            gh issue comment 12 --repo "$GITHUB_REPOSITORY" --body "R3 attempt $ATTEMPT did not succeed. Failed jobs were automatically re-run. Evidence: $RUN_URL"
          else
            gh issue comment 12 --repo "$GITHUB_REPOSITORY" --body "R3 reached the three-attempt safety limit. The program remains blocked at R3; no context-savings claim is admitted. Evidence: $RUN_URL"
            exit 1
          fi

      - name: Adjudicate successful R3 evidence
        if: steps.run.outputs.conclusion == 'success'
        env:
          RUN_ID: ${{ steps.run.outputs.run_id }}
          RUN_URL: ${{ steps.run.outputs.run_url }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          import hashlib, json, math, statistics
          from pathlib import Path

          base = Path('experiments/sv-cost-program/r3-full-vs-managed')
          result_path = base / 'results/result.json'
          protocol_path = base / 'protocol.json'
          governance_path = base / 'governance.json'
          relations_path = Path('experiments/sv-cost-program/relations.json')
          out_path = Path('experiments/sv-cost-program/results/r3-adjudication.json')
          analysis_path = Path('docs/SV_COST_MAJOR_ANALYSIS.md')

          result = json.loads(result_path.read_text())
          protocol = json.loads(protocol_path.read_text())
          governance = json.loads(governance_path.read_text())
          relations = json.loads(relations_path.read_text())

          assert result['paired_n'] == 5
          assert len(result['results']) == 10
          assert result['transition_status'] in {'R3_OBSERVED_AND_VALIDATED','R3_QUALITY_DIVERGENCE'}

          full = [x for x in result['results'] if x['lane'] == 'full']
          managed = [x for x in result['results'] if x['lane'] == 'managed']
          assert len(full) == len(managed) == 5

          def lane_stats(rows):
            return {
              'mean_native_input_tokens': statistics.mean(x['native_input_tokens'] for x in rows),
              'mean_native_output_tokens': statistics.mean(x['native_output_tokens'] for x in rows),
              'mean_cost_usd': statistics.mean(x['pricing_derived_cost_usd'] for x in rows),
              'mean_latency_seconds': statistics.mean(x['latency_seconds'] for x in rows),
              'completion_rate': statistics.mean(1.0 if x['complete'] else 0.0 for x in rows),
              'verifier_pass_rate': statistics.mean(1.0 if x['verifier']['pass'] else 0.0 for x in rows),
            }

          fs, ms = lane_stats(full), lane_stats(managed)
          pairs = list(zip(sorted(full,key=lambda x:x['trial_id']), sorted(managed,key=lambda x:x['trial_id'])))
          cost_d = [m['pricing_derived_cost_usd']-f['pricing_derived_cost_usd'] for f,m in pairs]
          input_d = [m['native_input_tokens']-f['native_input_tokens'] for f,m in pairs]
          lat_d = [m['latency_seconds']-f['latency_seconds'] for f,m in pairs]

          def ci95(vals):
            if len(vals) < 2: return [vals[0], vals[0]]
            mean = statistics.mean(vals)
            sd = statistics.stdev(vals)
            half = 2.776 * sd / math.sqrt(len(vals))
            return [mean-half, mean+half]

          quality_equivalent = fs['completion_rate'] == ms['completion_rate'] and fs['verifier_pass_rate'] == ms['verifier_pass_rate']
          successful = quality_equivalent and fs['completion_rate'] == 1.0 and fs['verifier_pass_rate'] == 1.0
          if successful:
            verdict = 'CONTEXT_EFFECT_ADMISSIBLE_WITH_SUCCESSFUL_QUALITY_EQUIVALENCE'
          elif quality_equivalent:
            verdict = 'CONTEXT_EFFECT_OBSERVED_BUT_BOTH_LANES_FAILED_QUALITY_GATE'
          else:
            verdict = 'CONTEXT_EFFECT_NOT_ADMISSIBLE_DUE_TO_QUALITY_OR_COMPLETION_DIVERGENCE'

          sha = lambda p: 'sha256:' + hashlib.sha256(p.read_bytes()).hexdigest()
          adjudication = {
            'program_id':'SV-COST-MAJOR-GOAL-001',
            'relation_id':'R3-FULL-VS-STEGVERSE-CONTEXT',
            'status':'R3_ADJUDICATED',
            'verdict':verdict,
            'governance_interpretation':'The reconstructed prior state admitted R3. This adjudication determines whether managed context is an admissible successor claim under the locked invariants; worker identity is not treated as free-standing authority.',
            'evidence':{
              'result_sha256':sha(result_path),
              'protocol_sha256':sha(protocol_path),
              'governance_sha256':sha(governance_path),
              'paired_n':5,
            },
            'full':fs,
            'managed':ms,
            'paired_effect':{
              'mean_input_token_delta_managed_minus_full':statistics.mean(input_d),
              'input_token_delta_ci95':ci95(input_d),
              'mean_cost_delta_usd_managed_minus_full':statistics.mean(cost_d),
              'cost_delta_ci95':ci95(cost_d),
              'mean_latency_delta_seconds_managed_minus_full':statistics.mean(lat_d),
              'latency_delta_ci95':ci95(lat_d),
            },
            'publication_gate':{
              'quality_equivalent':quality_equivalent,
              'successful_quality_equivalent':successful,
              'headline_context_savings_admissible':successful and statistics.mean(cost_d) < 0,
              'pricing_is_invoice_evidence':False,
              'claim_boundary':'Context-management savings are admissible only when both lanes successfully satisfy the same completion and verifier requirements. Pricing-derived cost is not invoice evidence.'
            }
          }
          out_path.parent.mkdir(parents=True, exist_ok=True)
          out_path.write_text(json.dumps(adjudication, indent=2) + '\n')

          relations['status'] = 'R3_ADJUDICATED_R4_R5_SYNTHESIS_NEXT'
          for rel in relations['relations']:
            if rel['id'] == 'R3-FULL-VS-STEGVERSE-CONTEXT':
              rel['status'] = verdict
              rel['adjudication_ref'] = str(out_path)
            if rel['id'] == 'R5-REPEATED-TRIALS':
              rel['status'] = 'ACTIVE_ACROSS_R2_AND_R3_PAIRED_TRIALS'
          relations_path.write_text(json.dumps(relations, indent=2) + '\n')

          text = analysis_path.read_text() if analysis_path.exists() else '# SV-COST Major Analysis\n'
          marker = '\n## R3 — Full versus StegVerse-managed context\n'
          section = marker + f"\n- Verdict: `{verdict}`\n- Paired trials: 5\n- Full completion/verifier rates: {fs['completion_rate']:.0%} / {fs['verifier_pass_rate']:.0%}\n- Managed completion/verifier rates: {ms['completion_rate']:.0%} / {ms['verifier_pass_rate']:.0%}\n- Mean input-token delta, managed minus full: {statistics.mean(input_d):.2f}\n- Mean pricing-derived cost delta, managed minus full: ${statistics.mean(cost_d):.6f}\n- Mean latency delta, managed minus full: {statistics.mean(lat_d):.2f} seconds\n- Headline savings admissible: {str(adjudication['publication_gate']['headline_context_savings_admissible']).lower()}\n\nThe finding is bounded by successful quality equivalence and by the distinction between pricing-derived cost and invoice evidence.\n"
          if marker in text:
            text = text.split(marker)[0].rstrip() + section
          else:
            text = text.rstrip() + '\n' + section
          analysis_path.write_text(text)
          PY

      - name: Commit adjudication and advance program
        if: steps.run.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ steps.run.outputs.run_url }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sv-cost-r3-controller'
          git config user.email 'actions@users.noreply.github.com'
          git add experiments/sv-cost-program/results/r3-adjudication.json experiments/sv-cost-program/relations.json docs/SV_COST_MAJOR_ANALYSIS.md
          if ! git diff --cached --quiet; then
            git commit -m "Adjudicate governed R3 and advance synthesis"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
          verdict="$(jq -r .verdict experiments/sv-cost-program/results/r3-adjudication.json)"
          gh issue comment 12 --repo "$GITHUB_REPOSITORY" --body "R3 was observed and adjudicated as \`$verdict\`. The canonical analysis and relation state were updated. Evidence: $RUN_URL"
