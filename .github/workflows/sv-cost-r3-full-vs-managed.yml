name: SV-COST R3 Full vs Managed Context [CONTAINED — TVC PROVIDER CAPABILITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sv-cost-r3-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block direct provider credential and source/evidence mutation path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::R3 full-vs-managed execution is contained because the prior workflow directly consumed a provider API secret, modified source during execution, and committed results under GitHub Actions authority."
          echo "Historical R3 evidence remains preserved. Any rerun/repair requires canonical TVC provider capability plus separately admitted source and publication mutation authority."
          exit 1
