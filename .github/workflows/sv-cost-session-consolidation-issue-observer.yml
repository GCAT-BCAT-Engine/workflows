name: SV-COST Issue Consolidation Observer

on:
  issues:
    types: [edited]

permissions:
  actions: read
  contents: write

jobs:
  observe:
    if: github.event.issue.number == 13 && contains(github.event.issue.body, 'OBSERVE_SV_COST_ISSUE_TRIGGER_20260803')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Observe newest issue-triggered consolidation run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_run="$GITHUB_RUN_ID"
          target=''
          for attempt in $(seq 1 30); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sv-cost-session-consolidation-issue-trigger.yml/runs?event=issues&branch=main&per_page=10")"
            target="$(jq -r --arg current "$current_run" '[.workflow_runs[] | select((.id|tostring) != $current)][0].id // empty' <<<"$runs")"
            [[ -n "$target" ]] && break
            sleep 2
          done
          test -n "$target"
          for attempt in $(seq 1 120); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target")"
            [[ "$(jq -r .status <<<"$run")" == completed ]] && break
            sleep 5
          done
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target")"
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target/jobs?filter=latest&per_page=100")"
          failed_log=''
          if [[ "$(jq -r .conclusion <<<"$run")" != success ]]; then
            failed_log="$(gh run view "$target" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -c 30000 || true)"
          fi
          mkdir -p experiments/sv-cost-program/results
          jq -n --argjson run "$run" --argjson jobs "$jobs" --arg failed_log "$failed_log" \
            '{program_id:"SV-COST-MAJOR-GOAL-001",status:(if $run.conclusion=="success" then "ISSUE_TRIGGER_OBSERVED_SUCCESS" else "ISSUE_TRIGGER_OBSERVED_FAILURE" end),run:{id:$run.id,html_url:$run.html_url,status:$run.status,conclusion:$run.conclusion,event:$run.event,run_attempt:$run.run_attempt,head_sha:$run.head_sha,created_at:$run.created_at,updated_at:$run.updated_at},jobs:[$jobs.jobs[]|{id,name,status,conclusion,started_at,completed_at,steps:[.steps[]?|{name,status,conclusion,number}]}],failed_log_tail:$failed_log}' \
            > experiments/sv-cost-program/results/session-consolidation-issue-trigger-observation.json

      - name: Commit issue-trigger observation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sv-cost-issue-trigger-observer'
          git config user.email 'actions@users.noreply.github.com'
          git add experiments/sv-cost-program/results/session-consolidation-issue-trigger-observation.json
          git commit -m "Observe issue-triggered SV-COST consolidation"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
