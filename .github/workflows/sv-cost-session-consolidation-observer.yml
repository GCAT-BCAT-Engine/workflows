name: SV-COST Session Consolidation Observer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sv-cost-session-consolidation-observer.yml'

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: sv-cost-session-consolidation-observer
  cancel-in-progress: false

jobs:
  dispatch-observe-record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Dispatch and observe consolidation
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run sv-cost-session-consolidation.yml --repo "$GITHUB_REPOSITORY" --ref main
          run_id=''
          for attempt in $(seq 1 30); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sv-cost-session-consolidation.yml/runs?branch=main&event=workflow_dispatch&per_page=10")"
            run_id="$(jq -r --arg started "$started" '[.workflow_runs[] | select(.created_at >= $started)][0].id // empty' <<<"$runs")"
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          test -n "$run_id" || { echo 'No dispatched consolidation run became observable' >&2; exit 1; }
          for attempt in $(seq 1 120); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            status="$(jq -r .status <<<"$run")"
            [[ "$status" == completed ]] && break
            sleep 5
          done
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
          conclusion="$(jq -r .conclusion <<<"$run")"
          failed_log=''
          if [[ "$conclusion" != success ]]; then
            failed_log="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -c 20000 || true)"
          fi
          mkdir -p experiments/sv-cost-program/results
          jq -n \
            --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson run "$run" \
            --argjson jobs "$jobs" \
            --arg failed_log "$failed_log" \
            '{program_id:"SV-COST-MAJOR-GOAL-001",status:(if $run.conclusion=="success" then "CONSOLIDATION_OBSERVED_SUCCESS" else "CONSOLIDATION_OBSERVED_FAILURE" end),observed_at:$observed_at,run:{id:$run.id,html_url:$run.html_url,status:$run.status,conclusion:$run.conclusion,event:$run.event,run_attempt:$run.run_attempt,head_sha:$run.head_sha,created_at:$run.created_at,updated_at:$run.updated_at},jobs:[$jobs.jobs[]|{id,name,status,conclusion,started_at,completed_at,steps:[.steps[]?|{name,status,conclusion,number}]}],failed_log_tail:$failed_log}' \
            > experiments/sv-cost-program/results/session-consolidation-observation.json
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Commit observation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sv-cost-session-observer'
          git config user.email 'actions@users.noreply.github.com'
          git add experiments/sv-cost-program/results/session-consolidation-observation.json
          git commit -m "Observe SV-COST session consolidation run ${{ steps.observe.outputs.run_id }}" || exit 0
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              pushed=true
              break
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          test "$pushed" = true

      - name: Fail closed on unsuccessful consolidation
        if: steps.observe.outputs.conclusion != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.observe.outputs.run_id }}
        shell: bash
        run: |
          gh issue comment 12 --repo "$GITHUB_REPOSITORY" --body "Session consolidation run $RUN_ID failed closed. Inspect \`experiments/sv-cost-program/results/session-consolidation-observation.json\`; no archive claim is admitted."
          exit 1
