name: SV-COST Session Consolidation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SV_COST_MIRROR_HANDOFF.md'
      - 'experiments/sv-cost-program/session-goal-inventory.json'
      - 'experiments/sv-cost-program/task-claims.json'
      - 'experiments/sv-cost-program/evidence-index.json'
      - 'experiments/sv-cost-program/lineage.json'
      - 'experiments/sv-cost-program/relations.json'
      - 'experiments/sv-cost-program/results/r3-adjudication.json'
      - 'experiments/sv-cost-program/results/r4-adjudication.json'
      - 'experiments/sv-cost-program/results/r5-reliability-synthesis.json'
      - 'experiments/sv-cost-program/results/cfo-decision.json'
      - 'docs/SV_COST_MAJOR_ANALYSIS.md'
      - 'docs/RECONSTRUCTABLE_STATE_TRANSITION_GOVERNANCE.md'
      - 'tools/reconcile_sv_cost_terminal_state.py'
      - 'tools/validate_sv_cost_session_state.py'
      - '.github/workflows/sv-cost-session-consolidation.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: sv-cost-session-consolidation
  cancel-in-progress: false

jobs:
  reconcile-validate-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RECEIPT: experiments/sv-cost-program/results/session-consolidation-receipt.json
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate reconciliation code
        run: |
          python -m py_compile tools/reconcile_sv_cost_terminal_state.py
          python -m py_compile tools/validate_sv_cost_session_state.py

      - name: Reconcile terminal receipts into canonical state
        shell: bash
        run: |
          set -euo pipefail
          python tools/reconcile_sv_cost_terminal_state.py \
            --release-session \
            --workflow-run-url "$RUN_URL" \
            > /tmp/sv-cost-reconciliation.json
          test "$(jq -r .status /tmp/sv-cost-reconciliation.json)" = RECONCILED

      - name: Validate archive-ready state and write receipt
        shell: bash
        run: |
          set -euo pipefail
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python tools/validate_sv_cost_session_state.py \
            --write-receipt \
            --now "$NOW" \
            --workflow-run-url "$RUN_URL" \
            > /tmp/sv-cost-session-validation.json
          test "$(jq -r .status "$RECEIPT")" = ARCHIVE_READY
          test "$(jq -r .archive_readiness.ready "$RECEIPT")" = true
          test "$(jq -r .archive_readiness.no_active_chat_owned_tasks "$RECEIPT")" = true

      - name: Validate every canonical JSON surface
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            experiments/sv-cost-program/session-goal-inventory.json \
            experiments/sv-cost-program/task-claims.json \
            experiments/sv-cost-program/evidence-index.json \
            experiments/sv-cost-program/lineage.json \
            experiments/sv-cost-program/relations.json \
            experiments/sv-cost-program/results/r3-adjudication.json \
            experiments/sv-cost-program/results/r4-adjudication.json \
            experiments/sv-cost-program/results/r5-reliability-synthesis.json \
            experiments/sv-cost-program/results/cfo-decision.json \
            "$RECEIPT"; do
            python -m json.tool "$path" >/dev/null
          done
          grep -q 'TERMINAL BOUNDED DECISION' SV_COST_MIRROR_HANDOFF.md
          grep -q 'MERGED_INTO_CANONICAL_WORKSTREAM' SV_COST_MIRROR_HANDOFF.md
          grep -q 'DO_NOT_APPROVE_A_GENERAL_STEGVERSE_SAVINGS_CLAIM_FROM_CURRENT_EVIDENCE' docs/SV_COST_MAJOR_ANALYSIS.md
          ! grep -Eqi 'active R3 relation is testing|R3 pending|REPAIRED_GENERATION_DISPATCHED|Remaining governed transitions|SESSION CONSOLIDATION IN PROGRESS' \
            SV_COST_MIRROR_HANDOFF.md docs/SV_COST_MAJOR_ANALYSIS.md experiments/sv-cost-program/evidence-index.json experiments/sv-cost-program/lineage.json

      - name: Upload immutable consolidation evidence
        uses: actions/upload-artifact@v4
        with:
          name: sv-cost-session-consolidation-${{ github.run_id }}
          path: |
            SV_COST_MIRROR_HANDOFF.md
            experiments/sv-cost-program/session-goal-inventory.json
            experiments/sv-cost-program/task-claims.json
            experiments/sv-cost-program/evidence-index.json
            experiments/sv-cost-program/lineage.json
            experiments/sv-cost-program/relations.json
            experiments/sv-cost-program/results/r3-adjudication.json
            experiments/sv-cost-program/results/r4-adjudication.json
            experiments/sv-cost-program/results/r5-reliability-synthesis.json
            experiments/sv-cost-program/results/cfo-decision.json
            experiments/sv-cost-program/results/session-consolidation-receipt.json
            docs/SV_COST_MAJOR_ANALYSIS.md
            docs/RECONSTRUCTABLE_STATE_TRANSITION_GOVERNANCE.md
          if-no-files-found: error
          retention-days: 90

      - name: Commit reconciled state and archive-readiness receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sv-cost-session-consolidator'
          git config user.email 'actions@users.noreply.github.com'
          git add SV_COST_MIRROR_HANDOFF.md
          git add experiments/sv-cost-program/session-goal-inventory.json
          git add experiments/sv-cost-program/task-claims.json
          git add experiments/sv-cost-program/evidence-index.json
          git add experiments/sv-cost-program/lineage.json
          git add experiments/sv-cost-program/relations.json
          git add experiments/sv-cost-program/results/session-consolidation-receipt.json
          git add docs/SV_COST_MAJOR_ANALYSIS.md
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile terminal SV-COST state and release chat session [run $GITHUB_RUN_ID]"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                pushed=true
                break
              fi
              git rebase --abort || true
              sleep $((attempt * 3))
            done
            test "$pushed" = true
          fi

      - name: Close terminal program issues and record continuation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment 12 --repo "$GITHUB_REPOSITORY" --body "SV-COST session state was reconciled and released into the canonical repository workstream. Archive-readiness receipt: \`experiments/sv-cost-program/results/session-consolidation-receipt.json\`. Hosted evidence: $RUN_URL. The bounded decision remains \`DO_NOT_APPROVE_A_GENERAL_STEGVERSE_SAVINGS_CLAIM_FROM_CURRENT_EVIDENCE\`. Any future favorable ROI revision is owned exclusively by issue #13."
          gh issue close 11 --repo "$GITHUB_REPOSITORY" --reason completed --comment "Historical lineage was observed, validated, integrated into the terminal relational program, and preserved in the canonical handoff and receipts."
          gh issue close 12 --repo "$GITHUB_REPOSITORY" --reason completed --comment "The relational program, R1-R5 adjudications, bounded CFO decision, canonical synthesis, session handoff, claim registry, and archive-readiness receipt are committed and validated. Issue #13 owns any future favorable ROI evidence revision."
