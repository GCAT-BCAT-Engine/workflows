name: Recover Ten Advances Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ten-advances-recover-artifact.yml'

permissions:
  actions: read
  contents: write

concurrency:
  group: ten-advances-evidence-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download latest validated evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=ten-advances-estimation-evidence&per_page=20" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          test -n "$artifact_id" || { echo 'No non-expired ten-advances estimation artifact found'; exit 2; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/ten-advances-evidence.zip
          rm -rf /tmp/ten-advances-evidence
          mkdir -p /tmp/ten-advances-evidence
          unzip -q /tmp/ten-advances-evidence.zip -d /tmp/ten-advances-evidence
          find /tmp/ten-advances-evidence -maxdepth 4 -type f -print
          mkdir -p experiments/ten-advances/results reports
          if [ -d /tmp/ten-advances-evidence/results ]; then
            cp -R /tmp/ten-advances-evidence/results/. experiments/ten-advances/results/
          elif [ -d /tmp/ten-advances-evidence/experiments/ten-advances/results ]; then
            cp -R /tmp/ten-advances-evidence/experiments/ten-advances/results/. experiments/ten-advances/results/
          else
            echo 'Artifact did not contain the results directory'; exit 2
          fi
          report_path="$(find /tmp/ten-advances-evidence -type f -name 'ten-advances-estimation-summary.md' -print -quit)"
          test -n "$report_path" || { echo 'Artifact did not contain the summary report'; exit 2; }
          cp "$report_path" reports/ten-advances-estimation-summary.md
      - name: Revalidate recovered evidence
        run: python experiments/ten-advances/tools/validate_and_report.py
      - name: Commit recovered outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'stegverse-estimation-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add experiments/ten-advances/results reports/ten-advances-estimation-summary.md
          git diff --cached --quiet && exit 0
          git commit -m 'Recover validated ten advances provider estimates'
          git pull --rebase origin main
          git push origin HEAD:main
