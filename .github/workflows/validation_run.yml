name: StegVerse External Full Process v2 [CONTAINED — TVC / SOURCE EVIDENCE REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: external-full-process-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block direct provider credential and source-verification overclaim
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::External full-process validation is contained because the prior workflow directly consumed a provider API secret and labeled a static source list as verified without independently reconstructable source-verification evidence."
          echo "Provider access must use canonical TVC capability evidence. Source grounding/verification must be independently evidenced before a verified claim is emitted."
          exit 1
