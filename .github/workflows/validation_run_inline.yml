name: StegVerse Validation Run - REAL [CONTAINED — TVC PROVIDER CAPABILITY REQUIRED]

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: validation-run-inline-contained
  cancel-in-progress: false

jobs:
  contained:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block direct provider credential validation path
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Inline validation is contained because the prior workflow directly consumed a provider API secret inside a GitHub-hosted job."
          echo "Provider access must execute through canonical TVC capability authority and export only secret-free evidence to this validation consumer."
          exit 1
